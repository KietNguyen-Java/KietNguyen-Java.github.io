<html lang="vi">

<title>Nguyễn Tuấn Kiệt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nguyễn Tuấn Kiệt – Backend Developer (Java Spring Boot, Node.js)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }

/* Layout: sticky identity column (photo, contact, stack) beside a reading column laid out like a timeline of API "endpoints". */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #15211d;
  --muted: #5a6964;
  --line: #d9e0dd;
  --accent: #2446c7;
  --accent-soft: #e6ebfb;
  --ok: #1d7a4f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --ink: #e5ece9; --muted: #93a39d;
    --line: #26322e; --accent: #8fa6ff; --accent-soft: #1c2647; --ok: #5fd39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --ink: #e5ece9; --muted: #93a39d;
  --line: #26322e; --accent: #8fa6ff; --accent-soft: #1c2647; --ok: #5fd39a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 56px;
}

/* Top bar */
.topbar {
  grid-column: 1 / -1;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  font: 500 13px/1 var(--mono); color: var(--muted);
}
.status { display: inline-flex; align-items: center; gap: 8px; }
.status::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent);
}
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button {
  font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--muted);
  background: none; border: 0; padding: 7px 12px; border-radius: 999px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Sidebar */
aside { position: sticky; top: 24px; align-self: start; display: flex; flex-direction: column; gap: 28px; }
.photo {
  width: 120px; aspect-ratio: 244 / 324; max-width: 100%; object-fit: cover;
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
}
h1 {
  font: 800 clamp(2.3rem, 5vw, 2.9rem)/0.98 var(--display); letter-spacing: -0.03em;
  margin: 0; text-wrap: balance;
}
.role { margin: 10px 0 0; font: 500 14px/1.4 var(--mono); color: var(--accent); }
.contact { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 14.5px; }
.contact li { display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.contact .k { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.contact .v { overflow-wrap: anywhere; user-select: all; }
.copy {
  font: 500 11px/1 var(--mono); color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; cursor: pointer;
}
.copy:hover { color: var(--ink); border-color: var(--muted); }
.stack-title { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12.5px/1 var(--mono); padding: 7px 9px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--line);
}
.chip.core { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* Main */
main { display: flex; flex-direction: column; gap: 64px; min-width: 0; }
.hero { display: flex; flex-direction: column; gap: 20px; }
.hero p { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.4rem); line-height: 1.5; max-width: 34em; text-wrap: pretty; }
.hero p b { font-weight: 600; }
.request {
  font: 400 13px/1.7 var(--mono); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; overflow-x: auto; white-space: pre; color: var(--muted);
}
.request .m { color: var(--ok); font-weight: 500; }
.request .s { color: var(--accent); }
.request .key { color: var(--ink); }

section { display: flex; flex-direction: column; gap: 24px; }
h2 {
  margin: 0; display: flex; align-items: baseline; gap: 12px;
  font: 700 1.6rem/1.1 var(--display); letter-spacing: -0.02em;
}
h2 .path { font: 400 13px/1 var(--mono); color: var(--muted); letter-spacing: 0; }

.timeline { display: flex; flex-direction: column; gap: 0; }
.item {
  display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 24px;
  padding-block: 22px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; padding-top: 0; }
.when { font: 500 13px/1.5 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.item h3 { margin: 0; font: 700 1.18rem/1.3 var(--display); letter-spacing: -0.01em; }
.item .org { margin: 2px 0 0; font-weight: 500; color: var(--accent); font-size: 15px; }
.item .repo { font: 500 13px/1 var(--mono); }
.item .desc { margin: 8px 0 0; color: var(--muted); font-style: italic; }
.item ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 6px; max-width: 65ch; }
.item li::marker { color: var(--muted); }
.item li b { font-weight: 600; }
.tech { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.tech span { font: 400 12px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; }

.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 32px; }
.skill h4 { margin: 0 0 6px; font: 500 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.skill p { margin: 0; font-size: 15px; }

.certs { list-style: none; margin: 0; padding: 0; display: grid; }
.certs li {
  display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 24px;
  padding-block: 14px; border-top: 1px solid var(--line);
}
.certs li:first-child { border-top: 0; padding-top: 0; }
.certs .t { font-weight: 500; }
.certs .src { color: var(--muted); font-size: 14px; }

.interests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.interest { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.interest h4 { margin: 0 0 6px; font: 700 1.05rem/1.2 var(--display); }
.interest p { margin: 0; font-size: 14.5px; color: var(--muted); }
.others { margin: 0; color: var(--muted); font-size: 15px; }
.closing { margin: 0; max-width: 60ch; font-size: 17px; }

footer { font: 400 12px/1.5 var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 40px; }
  aside { position: static; }
  .id { display: flex; gap: 18px; align-items: flex-end; }
  .photo { width: 92px; }
  .interests { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .item, .certs li { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .skills { grid-template-columns: minmax(0, 1fr); }
  main { gap: 52px; }
}
@media (prefers-reduced-motion: no-preference) {
  main > section, .hero { animation: rise .5s ease both; }
  main > *:nth-child(2) { animation-delay: .05s; }
  main > *:nth-child(3) { animation-delay: .1s; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}

.dl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 500 12px/1 var(--mono); color: var(--muted); }
.dl a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.dl a:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>

  const done = () => { b.textContent = T[lang].copied; setTimeout(() => { b.textContent = T[lang].copy; }, 1500); };
